<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="tenant-favicon" href="/skillio.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title id="tenant-title">Skillio — Modern LMS Platform</title>
    <!-- Cache Buster, Stale-Chunk Recovery & Service Worker Cleaner -->
    <script>
      (function() {
        // Global safety fallbacks so stale/cached JS bundles never crash with ReferenceErrors
        var dummyComponent = function() { return null; };
        ['ArrowLeft', 'ArrowLeftCircle', 'ArrowRight', 'ChevronDown', 'ChevronRight',
         'Check', 'CheckCircle2', 'X', 'FileText', 'AlertCircle', 'LoaderCircle',
         'Plus', 'PlusCircle', 'Upload', 'Sparkles', 'Users', 'LayoutDashboard', 'Radio', 'Play'].forEach(function(icon) {
          if (typeof window[icon] === 'undefined') {
            window[icon] = dummyComponent;
          }
        });

        window.getStoredTenantSlug = window.getStoredTenantSlug || function() {
          try { return localStorage.getItem("skillio_active_tenant") || null; } catch(e) { return null; }
        };
        window.setStoredTenantSlug = window.setStoredTenantSlug || function(s) {
          try { if (s) localStorage.setItem("skillio_active_tenant", s); else localStorage.removeItem("skillio_active_tenant"); } catch(e) {}
        };
        window.clearStoredTenantSlug = window.clearStoredTenantSlug || function() {
          try { localStorage.removeItem("skillio_active_tenant"); } catch(e) {}
        };

        // Purge old service workers and CacheStorage
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }

        // Global auto-reload recovery if an old cached chunk throws an import or reference error
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : "";
          if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
              msg.indexOf('ArrowLef') !== -1 ||
              msg.indexOf('ArrowLeft') !== -1 ||
              msg.indexOf('is not defined') !== -1 ||
              msg.indexOf('getStoredTenantSlug') !== -1) {
            var now = Date.now();
            var lastReload = parseInt(sessionStorage.getItem('sw_recovery_reloaded_ts') || '0', 10);
            if (now - lastReload > 3000) {
              sessionStorage.setItem('sw_recovery_reloaded_ts', String(now));
              if ('caches' in window) {
                caches.keys().then(function(k) {
                  return Promise.all(k.map(function(n) { return caches.delete(n); }));
                }).then(function() {
                  window.location.reload(true);
                });
              } else {
                window.location.reload(true);
              }
            }
          }
        });
      })();
    </script>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-[#f8f7f4] text-[#1c1917] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
